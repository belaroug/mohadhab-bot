<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهرس المهذب في أصول الفقه</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary: #2c3e50; --gold: #c9a050; --bg: #f9f9f9; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; }
        header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 20px; }
        
        .chapter-btn { 
            width: 100%; text-align: right; padding: 15px; background: var(--primary); color: white;
            border: none; border-radius: 8px; margin-bottom: 10px; font-size: 18px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s;
        }
        .chapter-btn:hover { background: #34495e; }
        
        .content { display: none; padding: 15px; border: 1px solid #ddd; border-top: none; border-radius: 0 0 8px 8px; margin-top: -10px; margin-bottom: 15px; background: #fff; }
        .content.active { display: block; animation: slideDown 0.4s ease; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .sub-link { display: block; padding: 8px; color: #555; text-decoration: none; border-bottom: 1px dashed #eee; transition: 0.2s; }
        .sub-link:hover { color: var(--gold); padding-right: 15px; }
        
        .badge { background: var(--gold); color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>المهذب في علم أصول الفقه المقارن</h1>
        <p>فهرس الأبواب والفصول</p>
    </header>

    <div id="index">
        <button class="chapter-btn" onclick="toggleSection('p1')">
            <span>الباب الأول: المقدمات</span>
            <span class="badge">ج 1</span>
        </button>
        <div id="p1" class="content">
            <a href="#" class="sub-link" onclick="loadPage('المقدمة')">المقدمة</a>
            <a href="#" class="sub-link" onclick="loadPage('المبحث الأول: تعريف أصول الفقه')">الفصل الأول: في مقدمة في مبادئ علم أصول الفقه</a>
            <a href="#" class="sub-link" onclick="loadPage('المصطلحات الأصولية')">الفصل الثاني: في المصطلحات التي يحتاجها دارس أصول الفقه</a>
        </div>

        <button class="chapter-btn" onclick="toggleSection('p2')">
            <span>الباب الثاني: الحكم الشرعي والتكليف</span>
            <span class="badge">ج 1</span>
        </button>
        <div id="p2" class="content">
            <p style="color: #888; text-align: center;">جاري تجهيز محتوى هذا الباب...</p>
        </div>

        <button class="chapter-btn" onclick="toggleSection('p3')">
            <span>الباب الثالث: أدلة الأحكام الشرعية</span>
            <span class="badge">ج 2</span>
        </button>
        <div id="p3" class="content">
            <p style="color: #888; text-align: center;">المحتوى متاح قريباً...</p>
        </div>
    </div>

    <div id="displayArea" style="display:none; margin-top:30px; padding:20px; border-top:3px solid var(--gold);">
        <button onclick="backToIndex()" style="background:#eee; border:none; padding:5px 15px; cursor:pointer;">⬅ عودة للفهرس</button>
        <h2 id="pageTitle"></h2>
        <div id="pageBody"></div>
    </div>
</div>

<script>
    window.Telegram.WebApp.ready();

    function toggleSection(id) {
        const content = document.getElementById(id);
        const isActive = content.classList.contains('active');
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        if (!isActive) content.classList.add('active');
    }

    function loadPage(title) {
        document.getElementById('index').style.display = 'none';
        document.getElementById('displayArea').style.display = 'block';
        document.getElementById('pageTitle').innerText = title;
        
        // هنا يمكنك وضع شرط لعرض محتوى كل صفحة
        if(title === 'المبحث الأول: تعريف أصول الفقه') {
            document.getElementById('pageBody').innerHTML = "تفاصيل المبحث الأول: تعريف أصول الفقه لغة واصطلاحاً... (يمكنك وضع المحتوى التفصيلي هنا)";
        } else {
            document.getElementById('pageBody').innerHTML = "جاري جلب بيانات " + title;
        }
    }

    function backToIndex() {
        document.getElementById('index').style.display = 'block';
        document.getElementById('displayArea').style.display = 'none';
    }
</script>

</body>
</html>
